name: release-sdk
# Builds the SDK tarballs and attaches them to an existing GitHub release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, e.g. v0.1.0-alpha.3
        required: true
permissions:
  contents: write
jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: sdk/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: sdk/pnpm-lock.yaml
      - name: Build tarballs and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release_sdk_tarballs.sh "${{ inputs.tag }}"
