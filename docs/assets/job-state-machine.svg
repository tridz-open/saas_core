<svg viewBox="0 0 995 434" width="995" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/></marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/></marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/></marker>
    <marker id="arrow-pink" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ec4899"/></marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/></marker>
  </defs>
  <rect x="0" y="0" width="995" height="434" fill="#ffffff"/>
  <text x="497.5" y="34" font-size="16" fill="#1e293b" text-anchor="middle">Provision Job state machine</text>
  <!-- layer 1: grouping boxes -->
<rect x="265" y="55" width="705" height="270" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
<text x="275" y="69" font-size="11" fill="#64748b">Active states: dispatching, submitted, running, stuck, outcome_unknown</text>
  <!-- layer 2: connectors -->
<path d="M230,180 C 257,180 257,112 284,112" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<path d="M500,112 L 514,112" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
<path d="M730,112 L 744,112" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
<path d="M855,330 L 855,344" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<path d="M395,144 L 395,158" fill="none" stroke="#ec4899" stroke-width="1.5" marker-end="url(#arrow-pink)"/>
<path d="M835,144 L 835,158" fill="none" stroke="#ec4899" stroke-width="1.5" marker-end="url(#arrow-pink)"/>
<path d="M875,164 L 875,150" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
<path d="M290,210 L 236,210" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<path d="M125,144 L 125,158" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<path d="M125,248 L 125,234" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<path d="M260,112 L 236,112" fill="none" stroke="#ec4899" stroke-width="1.5" marker-end="url(#arrow-pink)"/>
<path d="M260,280 L 236,280" fill="none" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <!-- layer 3: boxes -->
<!-- failed: x=25, y=85, w=200, h=54, right=225, bottom=139 -->
<rect x="25" y="85" width="200" height="54" rx="6" fill="#fce7f3" stroke="#ec4899"/>
<text x="125" y="107.2" font-size="12" fill="#9d174d" text-anchor="middle">failed</text>
<text x="125" y="125.2" font-size="12" fill="#9d174d" text-anchor="middle">terminal; retry: pending</text>
<!-- pending: x=25, y=169, w=200, h=54, right=225, bottom=223 -->
<rect x="25" y="169" width="200" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
<text x="125" y="191.2" font-size="12" fill="#1e40af" text-anchor="middle">pending</text>
<text x="125" y="209.2" font-size="12" fill="#1e40af" text-anchor="middle">enqueue_job creates it</text>
<!-- na: x=25, y=253, w=200, h=54, right=225, bottom=307 -->
<rect x="25" y="253" width="200" height="54" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
<text x="125" y="275.2" font-size="12" fill="#6b21a8" text-anchor="middle">needs_attention</text>
<text x="125" y="293.2" font-size="12" fill="#6b21a8" text-anchor="middle">operator retry only</text>
<!-- disp: x=295, y=85, w=200, h=54, right=495, bottom=139 -->
<rect x="295" y="85" width="200" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
<text x="395" y="107.2" font-size="12" fill="#b45309" text-anchor="middle">dispatching</text>
<text x="395" y="125.2" font-size="12" fill="#b45309" text-anchor="middle">run_job, step journaled</text>
<!-- sub: x=525, y=85, w=200, h=54, right=725, bottom=139 -->
<rect x="525" y="85" width="200" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
<text x="625" y="107.2" font-size="12" fill="#b45309" text-anchor="middle">submitted</text>
<text x="625" y="125.2" font-size="12" fill="#b45309" text-anchor="middle">port call returned</text>
<!-- run: x=755, y=85, w=200, h=54, right=955, bottom=139 -->
<rect x="755" y="85" width="200" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
<text x="855" y="107.2" font-size="12" fill="#b45309" text-anchor="middle">running</text>
<text x="855" y="125.2" font-size="12" fill="#b45309" text-anchor="middle">workflow in progress</text>
<!-- ou: x=295, y=169, w=200, h=54, right=495, bottom=223 -->
<rect x="295" y="169" width="200" height="54" rx="6" fill="#fce7f3" stroke="#ec4899"/>
<text x="395" y="191.2" font-size="12" fill="#9d174d" text-anchor="middle">outcome_unknown</text>
<text x="395" y="209.2" font-size="12" fill="#9d174d" text-anchor="middle">exception, effect unknown</text>
<!-- rec: x=525, y=169, w=200, h=54, right=725, bottom=223 -->
<rect x="525" y="169" width="200" height="54" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
<text x="625" y="191.2" font-size="12" fill="#1e293b" text-anchor="middle">reconcile.run, every 15 min</text>
<text x="625" y="209.2" font-size="12" fill="#1e293b" text-anchor="middle">adopts or re-dispatches</text>
<!-- stuck: x=755, y=169, w=200, h=54, right=955, bottom=223 -->
<rect x="755" y="169" width="200" height="54" rx="6" fill="#fce7f3" stroke="#ec4899"/>
<text x="855" y="191.2" font-size="12" fill="#9d174d" text-anchor="middle">stuck</text>
<text x="855" y="209.2" font-size="12" fill="#9d174d" text-anchor="middle">no progress &gt; 30 min</text>
<!-- ok: x=755, y=355, w=200, h=54, right=955, bottom=409 -->
<rect x="755" y="355" width="200" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
<text x="855" y="377.2" font-size="12" fill="#166534" text-anchor="middle">succeeded</text>
<text x="855" y="395.2" font-size="12" fill="#166534" text-anchor="middle">terminal state</text>
  <!-- layer 4: labels and cross-layer lines -->
<text x="865" y="345" font-size="10" fill="#64748b" text-anchor="start">any active state</text>
<text x="135" y="158" font-size="10" fill="#64748b" text-anchor="start">retry</text>
<text x="135" y="243" font-size="10" fill="#64748b" text-anchor="start">operator retry</text>
<text x="285" y="268" font-size="10" fill="#64748b" text-anchor="start">Any active state may end in succeeded, failed or needs_attention; needs_attention is always legal.</text>
<text x="285" y="284" font-size="10" fill="#64748b" text-anchor="start">Backward edges exist too: reconcile can send active states back to dispatching or pending.</text>
<text x="285" y="300" font-size="10" fill="#64748b" text-anchor="start">Runner failures normally land in needs_attention (Tenant.status=failed), not failed.</text>
</svg>
