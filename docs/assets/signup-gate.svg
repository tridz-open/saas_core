<text x="635" y="308.2" font-size="12" fill="#b45309" text-anchor="middle">unknown value = closed</text>
<text x="635" y="326.2" font-size="12" fill="#b45309" text-anchor="middle">site_config</text>
<text x="635" y="344.2" font-size="12" fill="#b45309" text-anchor="middle">saas_core_signup_mode</text>
<text x="635" y="362.2" font-size="12" fill="#b45309" text-anchor="middle">or Platform Settings</text>
<text x="635" y="380.2" font-size="12" fill="#b45309" text-anchor="middle">signup_mode</text>
