<rect x="775" y="169" width="220" height="54" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
<text x="885" y="200.2" font-size="12" fill="#1e293b" text-anchor="middle">closed</text>
<!-- invite: x=775, y=253, w=220, h=138, right=995, bottom=391 -->
<rect x="775" y="253" width="220" height="138" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
