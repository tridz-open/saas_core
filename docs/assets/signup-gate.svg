<text x="135" y="335.2" font-size="12" fill="#1e40af" text-anchor="middle">email, invite_token?</text>
<!-- legacy: x=275, y=295, w=220, h=54, right=495, bottom=349 -->
<rect x="275" y="295" width="220" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
<text x="385" y="317.2" font-size="12" fill="#b45309" text-anchor="middle">saas_core_public_signup</text>
<text x="385" y="335.2" font-size="12" fill="#b45309" text-anchor="middle">truthy? (no: continue)</text>
<!-- allow0: x=275, y=211, w=220, h=54, right=495, bottom=265 -->
<rect x="275" y="211" width="220" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
<text x="385" y="233.2" font-size="12" fill="#166534" text-anchor="middle">allowed</text>
<text x="385" y="251.2" font-size="12" fill="#166534" text-anchor="middle">yes: legacy bypass</text>
