<rect x="1025" y="337" width="220" height="54" rx="6" fill="#fce7f3" stroke="#ec4899"/>
<text x="1135" y="368.2" font-size="12" fill="#9d174d" text-anchor="middle">no: 403 invite_required</text>
<!-- yes: allowed421: x=1025, y=421, w=220, h=54, right=1245, bottom=475 -->
<rect x="1025" y="421" width="220" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
<text x="1135" y="452.2" font-size="12" fill="#166534" text-anchor="middle">yes: allowed</text>
<!-- no: 403 not_allowlisted505: x=1025, y=505, w=220, h=54, right=1245, bottom=559 -->
<rect x="1025" y="505" width="220" height="54" rx="6" fill="#fce7f3" stroke="#ec4899"/>
<text x="1135" y="536.2" font-size="12" fill="#9d174d" text-anchor="middle">no: 403 not_allowlisted</text>
  <!-- layer 4: labels and cross-layer lines -->
<text x="395" y="288" font-size="10" fill="#64748b" text-anchor="start">yes</text>
