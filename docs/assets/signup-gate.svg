<text x="885" y="335.2" font-size="12" fill="#b45309" text-anchor="middle">Tenant Member</text>
<text x="885" y="353.2" font-size="12" fill="#b45309" text-anchor="middle">status=invited</text>
<!-- allow: x=775, y=421, w=220, h=138, right=995, bottom=559 -->
<rect x="775" y="421" width="220" height="138" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
<text x="885" y="476.2" font-size="12" fill="#b45309" text-anchor="middle">allowlist</text>
<text x="885" y="494.2" font-size="12" fill="#b45309" text-anchor="middle">email matches signup_allow?</text>
<text x="885" y="512.2" font-size="12" fill="#b45309" text-anchor="middle">exact address or @domain</text>
