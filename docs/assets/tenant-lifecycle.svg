<svg viewBox="0 0 1220 304" width="1220" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/></marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/></marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/></marker>
    <marker id="arrow-pink" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ec4899"/></marker>
  </defs>
  <rect x="0" y="0" width="1220" height="304" fill="#ffffff"/>
  <text x="610" y="34" font-size="16" fill="#1e293b" text-anchor="middle">Tenant lifecycle (Tenant.status)</text>
  <!-- layer 1: grouping boxes -->

  <!-- layer 2: connectors -->
<path d="M240,122 L 254,122" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<path d="M480,122 L 494,122" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
<path d="M720,122 L 734,122" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<path d="M960,122 L 974,122" fill="none" stroke="#ec4899" stroke-width="1.5" marker-end="url(#arrow-pink)"/>
<path d="M325,90 C 325,50 175,50 175,84" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
<path d="M325,154 L 325,168" fill="none" stroke="#ec4899" stroke-width="1.5" marker-end="url(#arrow-pink)"/>
<path d="M415,174 L 415,160" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
<path d="M565,154 L 565,168" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
<path d="M655,174 L 655,160" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<path d="M720,206 C 750,206 850.0,190 850.0,160" fill="none" stroke="#ec4899" stroke-width="1.5" marker-end="url(#arrow-pink)"/>
  <!-- layer 3: boxes -->
<!-- pending: x=25, y=95, w=210, h=54, right=235, bottom=149 -->
<rect x="25" y="95" width="210" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
<text x="130" y="117.2" font-size="12" fill="#1e40af" text-anchor="middle">pending</text>
<text x="130" y="135.2" font-size="12" fill="#1e40af" text-anchor="middle">from checkout or admin</text>
<!-- prov: x=265, y=95, w=210, h=54, right=475, bottom=149 -->
<rect x="265" y="95" width="210" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
<text x="370" y="117.2" font-size="12" fill="#b45309" text-anchor="middle">provisioning</text>
<text x="370" y="135.2" font-size="12" fill="#b45309" text-anchor="middle">provision job starts</text>
<!-- active: x=505, y=95, w=210, h=54, right=715, bottom=149 -->
<rect x="505" y="95" width="210" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
<text x="610" y="117.2" font-size="12" fill="#166534" text-anchor="middle">active</text>
<text x="610" y="135.2" font-size="12" fill="#166534" text-anchor="middle">complete_provision, mail</text>
<!-- term: x=745, y=95, w=210, h=54, right=955, bottom=149 -->
<rect x="745" y="95" width="210" height="54" rx="6" fill="#fce7f3" stroke="#ec4899"/>
<text x="850" y="117.2" font-size="12" fill="#9d174d" text-anchor="middle">terminating</text>
<text x="850" y="135.2" font-size="12" fill="#9d174d" text-anchor="middle">delete approved, job runs</text>
<!-- end: x=985, y=95, w=210, h=54, right=1195, bottom=149 -->
<rect x="985" y="95" width="210" height="54" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
<text x="1090" y="117.2" font-size="12" fill="#1e293b" text-anchor="middle">(end)</text>
<text x="1090" y="135.2" font-size="12" fill="#1e293b" text-anchor="middle">site removed, fc_site cleared</text>
<!-- failed: x=265, y=179, w=210, h=54, right=475, bottom=233 -->
<rect x="265" y="179" width="210" height="54" rx="6" fill="#fce7f3" stroke="#ec4899"/>
<text x="370" y="201.2" font-size="12" fill="#9d174d" text-anchor="middle">failed</text>
<text x="370" y="219.2" font-size="12" fill="#9d174d" text-anchor="middle">workflow or template failed</text>
<!-- susp: x=505, y=179, w=210, h=54, right=715, bottom=233 -->
<rect x="505" y="179" width="210" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
<text x="610" y="201.2" font-size="12" fill="#b45309" text-anchor="middle">suspended</text>
<text x="610" y="219.2" font-size="12" fill="#b45309" text-anchor="middle">dunning stage 3 or canceled</text>
  <!-- layer 4: labels and cross-layer lines -->
<text x="250" y="39" font-size="10" fill="#64748b" text-anchor="middle">capacity exhausted</text>
<text x="425" y="168" font-size="10" fill="#64748b" text-anchor="start">operator retries job</text>
<text x="665" y="168" font-size="10" fill="#64748b" text-anchor="start">payment succeeded</text>
<text x="610" y="262" font-size="10" fill="#64748b" text-anchor="middle">There is no terminated status: after a successful terminate job the tenant stays terminating with fc_site cleared.</text>
<text x="610" y="278" font-size="10" fill="#64748b" text-anchor="middle">Dunning stage 3 and subscription.canceled enqueue a suspend job; a later successful payment enqueues resume.</text>
</svg>
