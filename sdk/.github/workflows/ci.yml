name: ci
on:
  push:
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Codegen drift check
        run: pnpm codegen:check
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint:fc
      - run: pnpm lint:internal
      - name: Pack and smoke-test tarballs
        run: pnpm pack:all && pnpm smoke:pack
