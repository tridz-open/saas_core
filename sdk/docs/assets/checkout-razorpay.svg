<path d="M350,931 L 136,931" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <!-- layer 3: boxes -->
<!-- React app: x=25, y=58, w=200, h=36, right=225, bottom=94 -->
<rect x="25" y="58" width="200" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
<text x="125" y="80.2" font-size="12" fill="#1e40af" text-anchor="middle">React app</text>
<!-- client + react hooks: x=255, y=58, w=200, h=36, right=455, bottom=94 -->
<rect x="255" y="58" width="200" height="36" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
<text x="355" y="80.2" font-size="12" fill="#6b21a8" text-anchor="middle">client + react hooks</text>
<!-- Razorpay Checkout.js: x=485, y=58, w=200, h=36, right=685, bottom=94 -->
<rect x="485" y="58" width="200" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
<text x="585" y="80.2" font-size="12" fill="#b45309" text-anchor="middle">Razorpay Checkout.js</text>
<!-- saas_core API: x=715, y=58, w=200, h=36, right=915, bottom=94 -->
<rect x="715" y="58" width="200" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
<text x="815" y="80.2" font-size="12" fill="#166534" text-anchor="middle">saas_core API</text>
<!-- Provision Job: x=945, y=58, w=200, h=36, right=1145, bottom=94 -->
<rect x="945" y="58" width="200" height="36" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
<text x="1045" y="80.2" font-size="12" fill="#1e293b" text-anchor="middle">Provision Job</text>
  <!-- layer 4: labels and cross-layer lines -->
<text x="240" y="104" font-size="10" fill="#64748b" text-anchor="middle">useCheckout().mutateAsync(</text>
<text x="240" y="117" font-size="10" fill="#64748b" text-anchor="middle">{plan, interval, slug, urls})</text>
<text x="700" y="170" font-size="10" fill="#64748b" text-anchor="middle">POST checkout.create_session</text>
<text x="700" y="203" font-size="10" fill="#64748b" text-anchor="middle">CheckoutSession {session_id, tenant,</text>
<text x="700" y="216" font-size="10" fill="#64748b" text-anchor="middle">client_payload {provider, key, mode}}</text>
<text x="240" y="275" font-size="10" fill="#64748b" text-anchor="middle">session</text>
<text x="240" y="321" font-size="10" fill="#64748b" text-anchor="middle">useRazorpayCheckout().open(session)</text>
<text x="470" y="354" font-size="10" fill="#64748b" text-anchor="middle">loadRazorpayScript()</text>
<text x="470" y="367" font-size="10" fill="#64748b" text-anchor="middle">new Razorpay(options).open()</text>
<text x="470" y="413" font-size="10" fill="#64748b" text-anchor="middle">handler(razorpay_payment_id,</text>
<text x="470" y="426" font-size="10" fill="#64748b" text-anchor="middle">razorpay_signature, ...)</text>
<text x="700" y="472" font-size="10" fill="#64748b" text-anchor="middle">POST checkout.verify_payment</text>
<text x="700" y="485" font-size="10" fill="#64748b" text-anchor="middle">{gateway: "razorpay", payload}</text>
<text x="700" y="531" font-size="10" fill="#64748b" text-anchor="middle">VerifyPaymentResult {status:</text>
<text x="700" y="544" font-size="10" fill="#64748b" text-anchor="middle">accepted, duplicate, ignored or ok}</text>
<text x="240" y="603" font-size="10" fill="#64748b" text-anchor="middle">open() resolves</text>
<text x="930" y="636" font-size="10" fill="#64748b" text-anchor="middle">record payment event once,</text>
<text x="930" y="649" font-size="10" fill="#64748b" text-anchor="middle">enqueue provision job</text>
<text x="240" y="695" font-size="10" fill="#64748b" text-anchor="middle">useJob(jobId) or</text>
<text x="240" y="708" font-size="10" fill="#64748b" text-anchor="middle">useTenantLive(tenantId)</text>
<text x="700" y="754" font-size="10" fill="#64748b" text-anchor="middle">subscribe: SSE events.stream</text>
<text x="700" y="767" font-size="10" fill="#64748b" text-anchor="middle">fallback: polling</text>
<text x="700" y="826" font-size="10" fill="#64748b" text-anchor="middle">job.updated / tenant.updated</text>
<text x="700" y="872" font-size="10" fill="#64748b" text-anchor="middle">refetch jobs.get / tenants.get</text>
<text x="240" y="905" font-size="10" fill="#64748b" text-anchor="middle">Tenant status active</text>
<text x="240" y="918" font-size="10" fill="#64748b" text-anchor="middle">stops at a terminal state</text>
</svg>
